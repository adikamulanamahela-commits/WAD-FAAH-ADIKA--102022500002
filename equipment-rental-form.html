<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sports Equipment Rental</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen py-12 px-4">
  <div class="max-w-lg mx-auto">

    <!-- Judul -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-black">Sports Equipment Rental</h1>
      <p class="mt-4 text-lg text-gray-800">Kelola data alat olahraga, kondisi, dan tarif sewa.</p>
    </div>

    <!-- Kartu info -->
    <div class="bg-white border border-gray-200 rounded-2xl py-8 px-6 text-center mb-10">
      <div class="text-5xl mb-3" aria-hidden="true">🎾</div>
      <h2 class="text-lg font-bold text-black">Tambah Alat Olahraga</h2>
    </div>

    <!-- Form -->
    <div class="bg-white border border-gray-200 rounded-2xl p-8">
      <form action="#" method="post">
        //nama_alat
        <label for="nama_alat" class="block text-lg font-semibold text-black mb-2">Nama Alat</label>
        <input id="nama_alat" name="nama_alat" type="text" placeholder="Contoh: Raket, Bola, Rompi" required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-5 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-400 hover:border-gray-400" />

          //kategori
        <label for="kategori" class="block text-lg font-semibold text-black mb-2">Kategori Olahraga</label>
        <select id="kategori" name="kategori" required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-5 bg-white focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-400 hover:border-gray-400">
          <option>Tenis</option>
          <option>Futsal</option>
          <option>Badminton</option>
          <option>Renang</option>
          <option>Basket</option>
          <option>Lainnya</option>
        </select>

        <label for="kondisi" class="block text-lg font-semibold text-black mb-2">Kondisi Alat</label>
        <select id="kondisi" name="kondisi" required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-5 bg-white focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-400 hover:border-gray-400">
          <option>Baru</option>
          <option>Baik</option>
          <option>Perlu Perbaikan</option>
          <option>Rusak</option>
        </select>

        <label for="tarif" class="block text-lg font-semibold text-black mb-2">Tarif Sewa per Jam</label>
        <div class="flex border border-gray-300 rounded-lg mb-6 overflow-hidden focus-within:border-amber-500 focus-within:ring-2 focus-within:ring-amber-400 hover:border-gray-400">
          <span class="px-4 py-3 bg-gray-50 text-gray-600 border-r border-gray-300">Rp</span>
          <input id="tarif" name="tarif" type="number" min="0" placeholder="15000" required
            class="w-full px-4 py-3 border-0 focus:outline-none" />
        </div>

        <button type="submit"
          class="w-full bg-black text-white font-semibold rounded-lg py-3 hover:bg-gray-800 transition-colors">
          Simpan Alat
        </button>
      </form>
    </div>

  </div>
</body>
</html>
